name: KAOS CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: .memory/_scripts/requirements-lock.txt
      - run: pip install -r _scripts/requirements-lock.txt

      - name: Security audit (safety)
        run: |
          pip install safety
          safety check -r _scripts/requirements-lock.txt
        continue-on-error: true

      - name: Security audit (bandit)
        run: |
          pip install bandit
          bandit -r .. -x ../.workspace,../.memory_archive -f json -o bandit-report.json || true
        continue-on-error: true

      - run: python -m pytest tests/test_config.py tests/test_ingest.py tests/test_lint.py tests/test_dsol.py tests/test_deerflow_bridge.py tests/test_verification.py tests/test_fase3.py -v --tb=short -k "not start_stop and not vault_search and not kaos_research"
        name: Run test suite
      - run: python _scripts/vault.py health
        name: Health check
      - run: python _scripts/vault.py lint coverage
        name: Coverage check
      - name: Quality gate
        run: |
          python -c "
          import json
          from pathlib import Path
          cache = Path('.memory/cache/test-results.json')
          if cache.exists():
              r = json.loads(cache.read_text())
              score = r.get('passed', 0) / max(1, r.get('total', 1)) * 100
              print(f'Test pass rate: {score:.1f}%')
              if score < 80:
                  exit(1)
          else:
              print('No test results — skipping gate')
          "
