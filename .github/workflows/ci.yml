name: KAOS CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r _scripts/requirements.txt
      - run: python _scripts/tests/run.py --fast
        name: Run test suite (fast)
      - run: python _scripts/vault.py health
        name: Health check
      - run: python _scripts/vault.py lint coverage
        name: Coverage check
