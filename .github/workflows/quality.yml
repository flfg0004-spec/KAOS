name: Quality Gate
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flake8 pytest
      - run: flake8 .memory/_scripts/lib/kronos/executor.py .memory/_scripts/mcp_pipeline.py .memory/_scripts/dashboard.py --max-line-length=120
      - run: python .memory/_scripts/quality_gate.py
        working-directory: .memory/_scripts
