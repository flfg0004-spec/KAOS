services:
  # Base de datos Postgres para sesiones, memoria y tracing de AgentOS.
  # Uso: docker compose -f docker-compose.agno.yml up -d
  # Conexión: postgresql://agno:<password>@localhost:5433/agno
  postgres:
    image: postgres:16-alpine
    container_name: kaos-agno-postgres
    environment:
      POSTGRES_DB: agno
      POSTGRES_USER: agno
      POSTGRES_PASSWORD: ${AGNO_PG_PASSWORD:-agno}
    ports:
      # 5433 externo → 5432 interno (mapeado para no colisionar con Postgres local :5432)
      - "${AGNO_PG_PORT:-5433}:5432"
    volumes:
      - agno-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agno"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

volumes:
  agno-pg-data:
