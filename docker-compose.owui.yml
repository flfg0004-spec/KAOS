services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3000:8080"
    volumes:
      - open-webui-data:/app/backend/data
      - ./owui/pipelines:/app/pipelines
    environment:
      - OPENAI_API_BASE_URL=https://opencode.ai/zen/go/v1
      - OPENAI_API_KEY=${OPENCODE_GO_KEY}
      - WEBUI_SECRET_KEY=${OWUI_SECRET_KEY:-kaos-default-secret-change-me}
      - WEBUI_AUTH=true
      - ENABLE_SIGNUP=false
      - DEFAULT_USER_ROLE=pending
      - WEBUI_ADMIN_EMAIL=${KAOS_ADMIN_EMAIL:-admin@kaos.local}
      - WEBUI_ADMIN_PASSWORD=${KAOS_ADMIN_PASSWORD}
      - VECTOR_DB=chroma
      - RAG_EMBEDDING_ENGINE=openai
      - ENABLE_MCP=true
      - MCP_BASE_URL=http://mcpo-bridge:9090
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    depends_on:
      mcpo-bridge:
        condition: service_started

  mcpo-bridge:
    image: ghcr.io/open-webui/mcpo:main
    ports:
      - "9090:8000"
    volumes:
      - ./owui/mcpo-config:/config
    command: ["--config", "/config/mcp-servers.json"]
    restart: always

volumes:
  open-webui-data:
