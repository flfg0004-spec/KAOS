services:
  deerflow-sandbox:
    image: python:3.12-slim
    ports:
      - "8001:8001"
    volumes:
      - ./owui/sandbox:/sandbox
    working_dir: /sandbox
    command: >
      sh -c "pip install aiosandbox -q &&
             python -m aiosandbox.server --host 0.0.0.0 --port 8001"
    environment:
      - SANDBOX_TIMEOUT=30
      - SANDBOX_MAX_MEMORY=512m
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=100m
    cap_drop:
      - ALL
    cap_add: []
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
