repos:
  - repo: local
    hooks:
      - id: flake8
        name: flake8
        entry: python -m flake8
        language: system
        files: \.py$
        types: [python]
        args: [--max-line-length=120]
      - id: quality-gate
        name: quality-gate
        entry: python quality_gate.py
        language: system
        pass_filenames: false
        files: \.py$
