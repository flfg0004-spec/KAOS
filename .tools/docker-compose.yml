# KAOS Docker Infrastructure
# Servicios: SearXNG (metasearch) + Crawl4AI (web crawler) + LangFuse (LLM observability)
# Usage: docker compose -f .tools/docker-compose.yml up -d

services:
  searxng:
    image: searxng/searxng:latest
    container_name: kaos-searxng
    ports:
      - "8888:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8888
      - SEARXNG_SECRET_KEY=kaos-searxng-secret-2026
    restart: unless-stopped

  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: kaos-crawl4ai
    ports:
      - "11235:11235"
    volumes:
      - crawl4ai-data:/app/data
    environment:
      - CRAWL4AI_API_TOKEN=kaos-crawl4ai-token
      - MAX_CONCURRENT_TASKS=10
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:11235/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  langfuse:
    image: langfuse/langfuse:2
    container_name: kaos-langfuse
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - langfuse-db
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      - NEXTAUTH_SECRET=kaos-langfuse-secret-2026
      - NEXTAUTH_URL=http://127.0.0.1:3000
      - TELEMETRY_ENABLED=false
      - LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES=false
    restart: unless-stopped

  langfuse-db:
    image: postgres:16-alpine
    container_name: kaos-langfuse-db
    environment:
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=langfuse
      - POSTGRES_DB=langfuse
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  searxng-data:
  crawl4ai-data:
  langfuse-db-data:
