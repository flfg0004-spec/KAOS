# SearXNG Configuration for KAOS
# Minimal valid config for SearXNG

use_default_settings: true

general:
  instance_name: "KAOS - SearXNG"
  debug: false
  privacypolicy_url: false
  contact_url: false
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: all
  languages:
    - en
    - es
  formats:
    - html
    - json

server:
  secret_key: "kaos-searxng-local-secret-2026"
  bind_address: "0.0.0.0"
  port: 8888
  limiter: false
  image_proxy: false
  method: GET

ui:
  static_use_hash: true
  default_theme: simple
  default_locale: en
  results_on_new_tab: true

outgoing:
  request_timeout: 10.0
  max_request_timeout: 30.0
  useragent_suffix: ""
  enabling_http2: true
